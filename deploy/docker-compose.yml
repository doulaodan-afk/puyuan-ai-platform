version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.4
    container_name: puyuan-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - puyuan-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: puyuan-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - puyuan-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务 — 使用预构建镜像 + volume 挂载 jar，避免每次部署重新 build Docker 镜像
  backend:
    image: puyuan-ai-platform-backend:latest
    container_name: puyuan-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RATE_LIMIT_ENABLED: "true"
      CONTENT_SECURITY_ENABLED: ${CONTENT_SECURITY_ENABLED}
      WX_MINIAPP_APPID: ${WX_MINIAPP_APPID}
      WX_MINIAPP_SECRET: ${WX_MINIAPP_SECRET}
      WX_PAYMENT_MCHID: ${WX_PAYMENT_MCHID}
      WX_PAYMENT_API_V3_KEY: ${WX_PAYMENT_API_V3_KEY}
      WX_PAYMENT_NOTIFY_URL: ${WX_PAYMENT_NOTIFY_URL}
      WX_PAYMENT_PRIVATE_KEY_PATH: ${WX_PAYMENT_PRIVATE_KEY_PATH}
      WX_PAYMENT_MERCHANT_SERIAL_NUMBER: ${WX_PAYMENT_MERCHANT_SERIAL_NUMBER}
      WX_PAYMENT_MOCK_ENABLED: ${WX_PAYMENT_MOCK_ENABLED}
      WX_SUBSCRIBE_MOCK_ENABLED: ${WX_SUBSCRIBE_MOCK_ENABLED}
      WX_SUBSCRIBE_BALANCE_LOW_TEMPLATE_ID: ${WX_SUBSCRIBE_BALANCE_LOW_TEMPLATE_ID}
      WX_SUBSCRIBE_RECHARGE_SUCCESS_TEMPLATE_ID: ${WX_SUBSCRIBE_RECHARGE_SUCCESS_TEMPLATE_ID}
      AI_MOCK_ENABLED: ${AI_MOCK_ENABLED}
      APP_AI_MOCK_ENABLED: ${APP_AI_MOCK_ENABLED:-false}
      OPENAI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      # 阿里云短信
      ALIYUN_SMS_ENABLED: ${ALIYUN_SMS_ENABLED:-false}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      # 七牛云存储
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY:-}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY:-}
      QINIU_BUCKET: ${QINIU_BUCKET:-}
      QINIU_CDN_DOMAIN: ${QINIU_CDN_DOMAIN:-}
      APP_STORAGE_MOCK_ENABLED: ${APP_STORAGE_MOCK_ENABLED:-false}
    volumes:
      - ./platform-api-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
      - ./config:/app/config:ro
    ports:
      - "8080:8080"
    networks:
      - puyuan-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: puyuan-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - ./frontend/admin-web/dist:/usr/share/nginx/html/admin:ro
      - ./frontend/merchant-web/dist:/usr/share/nginx/html/merchant:ro
    networks:
      - puyuan-network
    command: >
      /bin/sh -c "nginx -g 'daemon off;'"

networks:
  puyuan-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
