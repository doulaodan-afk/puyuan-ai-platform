# ============================================================
# 濮院毛衫 AI 平台 - Docker Compose (生产环境)
# 
# 部署策略: 使用预构建基础镜像 + volume 挂载 jar，避免每次重新 build
# 
# 前置条件:
#   1. 先构建基础镜像: docker build -t puyuan-ai-platform-backend:latest -f Dockerfile.backend .
#   2. 复制 .env.example 为 .env 并修改配置
#   3. 确保 platform-api-0.0.1-SNAPSHOT.jar 在当前目录
# 
# 启动: docker-compose up -d
# 停止: docker-compose down
# 重启: docker-compose restart
# 日志: docker-compose logs -f [service]
# ============================================================

version: '3.8'

services:
  # ========================================
  # MySQL 8.4 数据库
  # ========================================
  mysql:
    image: mysql:8.4
    container_name: puyuan-mysql
    restart: always
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max_connections=500
      --innodb_buffer_pool_size=1G
      --innodb_log_file_size=256M
      --slow_query_log=1
      --slow_query_log_file=/var/log/mysql/slow.log
      --long_query_time=2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-logs:/var/log/mysql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - puyuan-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ========================================
  # Redis 7 缓存
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: puyuan-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - puyuan-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ========================================
  # 后端服务 - 预构建镜像 + volume 挂载 jar
  # ========================================
  backend:
    image: puyuan-ai-platform-backend:latest
    container_name: puyuan-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp"
      # 数据库
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 限流
      RATE_LIMIT_ENABLED: "true"
      TENANT_DEFAULT_RPM: ${TENANT_DEFAULT_RPM:-10}
      TENANT_PREMIUM_RPM: ${TENANT_PREMIUM_RPM:-100}
      # 内容安全
      CONTENT_SECURITY_ENABLED: ${CONTENT_SECURITY_ENABLED:-true}
      # 微信小程序
      WX_MINIAPP_APPID: ${WX_MINIAPP_APPID}
      WX_MINIAPP_SECRET: ${WX_MINIAPP_SECRET}
      # 微信支付
      WX_PAYMENT_MCHID: ${WX_PAYMENT_MCHID}
      WX_PAYMENT_API_V3_KEY: ${WX_PAYMENT_API_V3_KEY}
      WX_PAYMENT_NOTIFY_URL: ${WX_PAYMENT_NOTIFY_URL}
      WX_PAYMENT_PRIVATE_KEY_PATH: ${WX_PAYMENT_PRIVATE_KEY_PATH:-/app/config/apiclient_key.pem}
      WX_PAYMENT_MERCHANT_SERIAL_NUMBER: ${WX_PAYMENT_MERCHANT_SERIAL_NUMBER}
      WX_PAYMENT_MOCK_ENABLED: ${WX_PAYMENT_MOCK_ENABLED:-false}
      WX_SUBSCRIBE_MOCK_ENABLED: ${WX_SUBSCRIBE_MOCK_ENABLED:-false}
      WX_SUBSCRIBE_BALANCE_LOW_TEMPLATE_ID: ${WX_SUBSCRIBE_BALANCE_LOW_TEMPLATE_ID:-}
      WX_SUBSCRIBE_RECHARGE_SUCCESS_TEMPLATE_ID: ${WX_SUBSCRIBE_RECHARGE_SUCCESS_TEMPLATE_ID:-}
      # AI 服务
      AI_MOCK_ENABLED: ${AI_MOCK_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MULTI_KEY_ENABLED: ${AI_MULTI_KEY_ENABLED:-true}
      # 阿里云短信
      ALIYUN_SMS_ENABLED: ${ALIYUN_SMS_ENABLED:-false}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      # 七牛云存储
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY:-}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY:-}
      QINIU_BUCKET: ${QINIU_BUCKET:-puyuanmaoshan}
      QINIU_CDN_DOMAIN: ${QINIU_CDN_DOMAIN:-}
      APP_STORAGE_MOCK_ENABLED: ${APP_STORAGE_MOCK_ENABLED:-false}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - ./platform-api-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
      - ./config:/app/config:ro
      - backend_logs:/app/logs
    ports:
      - "8080:8080"
    networks:
      - puyuan-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ========================================
  # Nginx 反向代理
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: puyuan-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - ./frontend/merchant-web/dist:/usr/share/nginx/html/merchant:ro
      - ./frontend/admin-web/dist:/usr/share/nginx/html/admin:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - puyuan-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  puyuan-network:
    driver: bridge
    name: puyuan-network

volumes:
  mysql_data:
    driver: local
    name: puyuan_mysql_data
  redis_data:
    driver: local
    name: puyuan_redis_data
  backend_logs:
    driver: local
    name: puyuan_backend_logs
