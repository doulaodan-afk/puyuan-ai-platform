# Prometheus 配置文件
# 用于抓取平台 API 的监控指标

global:
  # 抓取间隔
  scrape_interval: 15s
  # 评估间隔
  evaluation_interval: 15s
  # 外部标签
  external_labels:
    cluster: 'puyuan-production'
    env: 'prod'

# 告警规则文件
rule_files:
  - 'alerts.yml'

# 抓取配置
scrape_configs:
  # 平台 API 应用指标
  - job_name: 'platform-api'
    metrics_path: '/actuator/prometheus'
    scheme: http
    static_configs:
      - targets:
          # 生产环境 API 服务器列表
          - 'platform-api-1:8080'
          - 'platform-api-2:8080'
        labels:
          service: 'platform-api'
          tier: 'backend'

  # Redis 监控（如果使用 redis_exporter）
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']
        labels:
          service: 'redis'
          tier: 'cache'

  # MySQL 监控（如果使用 mysqld_exporter）
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']
        labels:
          service: 'mysql'
          tier: 'database'

  # Nginx 监控（如果使用 nginx-prometheus-exporter）
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'
          tier: 'gateway'
