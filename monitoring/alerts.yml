# Prometheus 告警规则

groups:
  - name: platform_alerts
    interval: 30s
    rules:
      # ========== 应用健康告警 ==========
      - alert: ApplicationUnhealthy
        expr: up{job="platform-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: platform-api
        annotations:
          summary: "应用实例不健康"
          description: "平台 API {{ $labels.instance }} 已停止响应超过 2 分钟"

      # ========== AI 服务告警 ==========
      - alert: HighAiFailureRate
        expr: |
          (
            sum(rate(ai_call_failure_total[5m])) by (group, provider)
            /
            (sum(rate(ai_call_success_total[5m])) by (group, provider) + sum(rate(ai_call_failure_total[5m])) by (group, provider))
          ) > 0.5
        for: 5m
        labels:
          severity: critical
          service: ai_service
        annotations:
          summary: "AI 服务失败率过高"
          description: "{{ $labels.group }}/{{ $labels.provider }} 失败率超过 50% (当前值: {{ $value | humanizePercentage }})"

      - alert: FrequentAiKeySwitch
        expr: sum(rate(ai_key_switch_total[10m])) by (group, provider) > 0.5
        for: 10m
        labels:
          severity: warning
          service: ai_service
        annotations:
          summary: "AI Key 切换频繁"
          description: "{{ $labels.group }}/{{ $labels.provider }} 在 10 分钟内切换超过 5 次"

      - alert: ZeroAiCalls
        expr: sum(rate(ai_call_success_total[10m])) + sum(rate(ai_call_failure_total[10m])) == 0
        for: 15m
        labels:
          severity: warning
          service: ai_service
        annotations:
          summary: "AI 服务无调用"
          description: "在最近 15 分钟内没有任何 AI 调用"

      # ========== OSS 服务告警 ==========
      - alert: FrequentOssSwitch
        expr: sum(rate(oss_switch_total[10m])) by (bucket) > 0.1
        for: 10m
        labels:
          severity: warning
          service: oss_service
        annotations:
          summary: "OSS 切换频繁"
          description: "Bucket {{ $labels.bucket }} 在 10 分钟内切换超过 1 次"

      # ========== 数据库告警 ==========
      - alert: HighDatabaseConnections
        expr: |
          sum(mysql_global_status_threads_connected) by (instance)
          /
          sum(mysql_global_variables_max_connections) by (instance)
          > 0.8
        for: 5m
        labels:
          severity: warning
          service: mysql
        annotations:
          summary: "数据库连接使用率过高"
          description: "MySQL {{ $labels.instance }} 连接使用率超过 80%"

      # ========== 缓存告警 ==========
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis 服务不可用"
          description: "Redis {{ $labels.instance }} 无法访问"

      - alert: HighRedisMemoryUsage
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis 内存使用率过高"
          description: "Redis {{ $labels.instance }} 内存使用率超过 90%"

      # ========== Nginx 告警 ==========
      - alert: High429Rate
        expr: |
          sum(rate(nginx_http_requests_total{status="429"}[5m])) by (instance)
          /
          sum(rate(nginx_http_requests_total[5m])) by (instance)
          > 0.05
        for: 5m
        labels:
          severity: warning
          service: nginx
        annotations:
          summary: "429 错误率过高"
          description: "Nginx {{ $labels.instance }} 429 错误率超过 5%，可能需要扩容"

      - alert: HighErrorRate
        expr: |
          sum(rate(nginx_http_requests_total{status=~"5.."}[5m])) by (instance)
          /
          sum(rate(nginx_http_requests_total[5m])) by (instance)
          > 0.01
        for: 5m
        labels:
          severity: warning
          service: nginx
        annotations:
          summary: "HTTP 5xx 错误率过高"
          description: "Nginx {{ $labels.instance }} 5xx 错误率超过 1%"

      # ========== JVM 告警 ==========
      - alert: HighJvmMemoryUsage
        expr: |
          jvm_memory_used_bytes / jvm_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          service: platform-api
        annotations:
          summary: "JVM 内存使用率过高"
          description: "JVM {{ $labels.instance }} 内存使用率超过 90%"

      - alert: HighJvmGcTime
        expr: |
          sum(rate(jvm_gc_pause_seconds_sum[5m])) by (instance)
          /
          sum(rate(jvm_gc_pause_seconds_count[5m])) by (instance)
          > 0.1
        for: 10m
        labels:
          severity: warning
          service: platform-api
        annotations:
          summary: "JVM GC 时间过长"
          description: "JVM {{ $labels.instance }} 平均 GC 暂停时间超过 100ms"
