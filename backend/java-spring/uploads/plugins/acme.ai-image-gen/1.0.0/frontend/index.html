<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 商品图生成插件</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="plugin-root" id="pluginRoot">

    <!-- Header -->
    <div class="plugin-header">
      <h2 class="plugin-title">AI 商品图生成</h2>
      <span class="token-badge" id="balanceBadge">— Tokens</span>
    </div>

    <!-- Body -->
    <div class="plugin-body">

      <!-- 错误提示 -->
      <div id="errorMsg" class="error-msg" style="display:none;"></div>

      <!-- 输入表单 -->
      <div class="form-group">
        <label for="promptInput">提示词</label>
        <textarea
          id="promptInput"
          rows="4"
          placeholder="描述您想要生成的图片内容，例如：红色濮院毛衫，圆领，简约风格..."
        ></textarea>
      </div>

      <!-- 尺寸选择 -->
      <div class="form-group">
        <label for="sizeSelect">图片尺寸</label>
        <select id="sizeSelect">
          <option value="512x512">512×512 (10 Tokens)</option>
          <option value="1024x1024" selected>1024×1024 (20 Tokens)</option>
          <option value="1792x1024">1792×1024 横版 (30 Tokens)</option>
          <option value="1024x1792">1024×1792 竖版 (30 Tokens)</option>
        </select>
      </div>

      <!-- 费用预览 -->
      <div class="cost-info">
        <span>本次消耗</span>
        <span class="cost-value" id="costDisplay">20 Tokens</span>
      </div>

      <!-- 提交按钮 -->
      <button id="submitBtn" class="submit-btn">生成图片</button>

      <!-- 结果展示 -->
      <div id="resultCard" class="result-card" style="display:none;">
        <h3>生成结果</h3>
        <img id="resultImage" class="result-image" alt="生成的图片" />
        <div class="result-meta">
          <div class="meta-item">
            <span class="label">尺寸</span>
            <span class="value" id="resultSize">—</span>
          </div>
          <div class="meta-item">
            <span class="label">消耗</span>
            <span class="value" id="resultToken">—</span>
          </div>
          <div class="meta-item">
            <span class="label">剩余</span>
            <span class="value" id="resultBalance">—</span>
          </div>
        </div>
      </div>

      <!-- 空状态提示 -->
      <p id="placeholderText" class="placeholder-text">输入提示词，点击「生成图片」开始创作</p>

    </div>
  </div>

  <script>
    /**
     * AI 商品图生成插件 - 前端（iframe 嵌入）
     *
     * 遵循 PLUGIN_API_SPECIFICATION.md 规范：
     * - 监听主框架的 INIT / THEME_CHANGE / INVOKE 消息
     * - 完成后发送 PLUGIN_READY 消息
     * - 调用结果发送 INVOKE_RESULT 消息
     * - 错误发送 ERROR 消息
     * - 使用主框架提供的 CSS 变量
     */

    // ========== 状态 ==========
    let platformContext = null;  // { tenantId, token, apiBaseUrl, theme, config }
    let currentTheme = 'light';
    let loading = false;

    // ========== DOM 引用 ==========
    const pluginRoot = document.getElementById('pluginRoot');
    const balanceBadge = document.getElementById('balanceBadge');
    const errorMsg = document.getElementById('errorMsg');
    const promptInput = document.getElementById('promptInput');
    const sizeSelect = document.getElementById('sizeSelect');
    const costDisplay = document.getElementById('costDisplay');
    const submitBtn = document.getElementById('submitBtn');
    const resultCard = document.getElementById('resultCard');
    const resultImage = document.getElementById('resultImage');
    const resultSize = document.getElementById('resultSize');
    const resultToken = document.getElementById('resultToken');
    const resultBalance = document.getElementById('resultBalance');
    const placeholderText = document.getElementById('placeholderText');

    // ========== Token 消耗映射 ==========
    const TOKEN_COSTS = {
      '512x512': 10,
      '1024x1024': 20,
      '1792x1024': 30,
      '1024x1792': 30,
    };

    // ========== 平台通信层 ==========

    /**
     * 监听主框架发来的消息
     * 消息格式：{ type: string, payload: object }
     */
    window.addEventListener('message', async (event) => {
      const { type, payload } = event.data || {};

      switch (type) {
        case 'INIT':
          // 主框架向插件发送初始化数据
          platformContext = payload;
          currentTheme = payload.theme || 'light';
          applyTheme(currentTheme);

          // 更新余额显示
          if (payload.balance !== undefined) {
            updateBalanceDisplay(payload.balance);
          }

          // 初始化完成后通知主框架
          window.parent.postMessage({ type: 'PLUGIN_READY', payload: {} }, '*');
          break;

        case 'THEME_CHANGE':
          currentTheme = payload.theme;
          applyTheme(currentTheme);
          break;

        case 'INVOKE':
          // 主框架要求插件执行特定操作
          await handleInvoke(payload);
          break;
      }
    });

    // ========== 主题应用 ==========

    function applyTheme(theme) {
      pluginRoot.setAttribute('data-theme', theme);
    }

    // ========== 业务逻辑层 ==========

    /**
     * 处理 INVOKE 调用（当主框架通过 postMessage 触发时）
     */
    async function handleInvoke(payload) {
      const { action, args } = payload;

      if (action === 'generate') {
        promptInput.value = args.prompt || '';
        sizeSelect.value = args.image_size || '1024x1024';
        updateCostDisplay();
        await callGenerateApi();
      }
    }

    /**
     * 调用插件后端 API
     */
    async function callGenerateApi() {
      const prompt = promptInput.value.trim();
      if (!prompt) {
        showError('请输入提示词');
        return;
      }

      const imageSize = sizeSelect.value;
      setLoading(true);
      hideError();
      hideResult();

      try {
        // 确定后端地址（优先使用 platformContext 中的配置）
        const apiBase = platformContext?.apiBaseUrl || 'http://localhost:3001';
        const url = apiBase.replace(/\/$/, '') + '/';

        const headers = {
          'Content-Type': 'application/json',
          'X-Tenant-Id': platformContext?.tenantId || 'anonymous',
        };
        if (platformContext?.token) {
          headers['Authorization'] = `Bearer ${platformContext.token}`;
        }

        const response = await fetch(url, {
          method: 'POST',
          headers,
          body: JSON.stringify({ prompt, image_size: imageSize }),
        });

        const result = await response.json();

        if (result.code !== 0) {
          throw new Error(result.message || `Error ${result.code}`);
        }

        // 更新余额显示
        updateBalanceDisplay(result.balance_remaining);

        // 显示结果
        showResult(result.data, result.token_used, result.balance_remaining);

        // 通过 postMessage 返回结果给主框架
        window.parent.postMessage({
          type: 'INVOKE_RESULT',
          payload: {
            success: true,
            data: result.data,
            tokenUsed: result.token_used,
            balanceRemaining: result.balance_remaining,
            message: result.message,
          },
        }, '*');

      } catch (err) {
        const msg = err instanceof Error ? err.message : '生成失败';
        showError(msg);

        window.parent.postMessage({
          type: 'ERROR',
          payload: {
            code: 50001,
            message: msg,
          },
        }, '*');
      } finally {
        setLoading(false);
      }
    }

    // ========== UI 辅助函数 ==========

    function updateBalanceDisplay(balance) {
      if (balance !== undefined) {
        balanceBadge.textContent = `${Number(balance).toLocaleString()} Tokens`;
      }
    }

    function updateCostDisplay() {
      const size = sizeSelect.value;
      const cost = TOKEN_COSTS[size] || 20;
      costDisplay.textContent = `${cost} Tokens`;
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    function hideError() {
      errorMsg.style.display = 'none';
    }

    function showResult(data, tokenUsed, balanceRemaining) {
      resultImage.src = data.image_url;
      resultSize.textContent = data.image_size;
      resultToken.textContent = `${tokenUsed} Tokens`;
      resultBalance.textContent = `${Number(balanceRemaining).toLocaleString()} Tokens`;

      resultCard.style.display = 'flex';
      placeholderText.style.display = 'none';
    }

    function hideResult() {
      resultCard.style.display = 'none';
      placeholderText.style.display = 'block';
      resultImage.src = '';
    }

    function setLoading(val) {
      loading = val;
      submitBtn.disabled = val;
      submitBtn.textContent = val ? '生成中...' : '生成图片';
    }

    // ========== 事件绑定 ==========

    sizeSelect.addEventListener('change', updateCostDisplay);

    submitBtn.addEventListener('click', () => {
      if (!loading) {
        window.parent.postMessage({ type: 'PLUGIN_STATUS', payload: { status: 'computing' } }, '*');
        void callGenerateApi();
      }
    });

    promptInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!loading) void callGenerateApi();
      }
    });

    // 初始化费用显示
    updateCostDisplay();
  </script>
</body>
</html>
