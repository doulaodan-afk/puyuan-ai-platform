# ========================================
# Docker 环境配置
# 通过环境变量覆盖连接信息
# ========================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:puyuan_ai_mvp}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:test123}
    password: ${MYSQL_PASSWORD:test123}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000

rate-limit:
  enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true

logging:
  level:
    com.puyuanmaoshan: INFO
    org.springframework.web: INFO
    org.springframework.boot: INFO

app:
  base-url: http://localhost:8080
  ai:
    mock-image-url: https://via.placeholder.com/300x200
    mock-script-response: "这是一个示例脚本"
    mock-translate-response: "Translated text"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
