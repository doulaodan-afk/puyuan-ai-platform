server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      force-request: true
      force-response: true
  tomcat:
    max-file-size: 100MB
    max-request-size: 100MB

spring:
  application:
    name: platform-api
  messages:
    encoding: UTF-8
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2KB
  encoding:
    charset: UTF-8
    force: true
    force-request: true
    force-response: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    enable-auth-check: false
    jwt-secret: ${JWT_SECRET:puyuanmaoshan-default-jwt-secret-change-in-production}
    jwt-expire-hours: ${JWT_EXPIRE_HOURS:168}
  billing:
    upstream-timeout-seconds: 30

# 微信小程序配置（生产环境通过环境变量覆盖）
wx:
  miniapp:
    appid: ${WX_MINIAPP_APPID:}
    secret: ${WX_MINIAPP_SECRET:}
  payment:
    mchid: ${WX_PAYMENT_MCHID:}
    api-v3-key: ${WX_PAYMENT_API_V3_KEY:}
    notify-url: ${WX_PAYMENT_NOTIFY_URL:}
    private-key-path: ${WX_PAYMENT_PRIVATE_KEY_PATH:}
    merchant-serial-number: ${WX_PAYMENT_MERCHANT_SERIAL_NUMBER:}
    mock-enabled: ${WX_PAYMENT_MOCK_ENABLED:true}
  subscribe:
    mock-enabled: ${WX_SUBSCRIBE_MOCK_ENABLED:true}
    balance-low-template-id: ${WX_SUBSCRIBE_BALANCE_LOW_TEMPLATE_ID:}
    recharge-success-template-id: ${WX_SUBSCRIBE_RECHARGE_SUCCESS_TEMPLATE_ID:}
