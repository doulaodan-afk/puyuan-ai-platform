server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      force-request: true
      force-response: true
  tomcat:
    max-file-size: 100MB
    max-request-size: 100MB

spring:
  application:
    name: platform-api
  messages:
    encoding: UTF-8
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2KB
  encoding:
    charset: UTF-8
    force: true
    force-request: true
    force-response: true
  # Flyway 数据库迁移（默认关闭，按环境启用）
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  ai:
    mock-enabled: true
  security:
    enable-auth-check: false
    jwt-secret: ${JWT_SECRET:puyuanmaoshan-default-jwt-secret-change-in-production}
    jwt-expire-hours: ${JWT_EXPIRE_HOURS:168}
  billing:
    upstream-timeout-seconds: 30

# ============================================================
# 多 Key 轮询与故障转移配置
# ============================================================
ai:
  multi-key:
    # 是否启用多 Key 轮询（也可通过 DB system_config 动态控制）
    enabled: ${AI_MULTI_KEY_ENABLED:true}
    # Key 调用失败后的冷却时间（秒）
    key-cooldown-seconds: ${AI_KEY_COOLDOWN_SECONDS:60}
    # 全局最大重试次数（含同 Key 和跨提供商）
    max-retry-attempts: ${AI_MAX_RETRY_ATTEMPTS:3}

# ============================================================
# 限流配置（租户分级）
# ============================================================
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  token-bucket:
    capacity: 60
    refill-rate: 1
  tenant:
    # 默认租户 RPM
    default-rpm: ${TENANT_DEFAULT_RPM:10}
    # 付费租户 RPM
    premium-rpm: ${TENANT_PREMIUM_RPM:100}
    # 突发系数（允许短时超过 RPM 限制的倍数）
    burst-multiplier: ${TENANT_BURST_MULTIPLIER:2.0}

# 微信小程序配置（生产环境通过环境变量覆盖）
wx:
  miniapp:
    appid: ${WX_MINIAPP_APPID:}
    secret: ${WX_MINIAPP_SECRET:}
  payment:
    mchid: ${WX_PAYMENT_MCHID:}
    api-v3-key: ${WX_PAYMENT_API_V3_KEY:}
    notify-url: ${WX_PAYMENT_NOTIFY_URL:}
    private-key-path: ${WX_PAYMENT_PRIVATE_KEY_PATH:}
    merchant-serial-number: ${WX_PAYMENT_MERCHANT_SERIAL_NUMBER:}
    mock-enabled: ${WX_PAYMENT_MOCK_ENABLED:true}
  subscribe:
    mock-enabled: ${WX_SUBSCRIBE_MOCK_ENABLED:true}
    balance-low-template-id: ${WX_SUBSCRIBE_BALANCE_LOW_TEMPLATE_ID:}
    recharge-success-template-id: ${WX_SUBSCRIBE_RECHARGE_SUCCESS_TEMPLATE_ID:}
